<nav
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  [ngClass]="{
    'bg-slate-900/98 backdrop-blur-md shadow-lg border-b border-slate-800/80': isScrolled || isMobileMenuOpen,
    'bg-transparent': !isScrolled && !isMobileMenuOpen
  }"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a
        (click)="scrollTo('#hero')"
        class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent cursor-pointer hover:opacity-80 transition-opacity"
      >
        {{ data.profile.name }}
      </a>

      <!-- Desktop Nav -->
      <div class="hidden md:flex items-center space-x-1">
        @for (link of navLinks; track link.href) {
          <a
            (click)="scrollTo(link.href)"
            class="px-3 py-2 text-sm text-slate-300 hover:text-cyan-400 transition-colors cursor-pointer rounded-lg hover:bg-slate-800/50"
          >
            {{ link.label }}
          </a>
        }
        <a
          href="assets/Arun_Angular_Profile.pdf"
          download
          class="ml-3 inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-900 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-lg hover:from-cyan-300 hover:to-blue-400 transition-all"
        >
          <lucide-icon [img]="DownloadIcon" [size]="16"></lucide-icon>
          Resume
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <button
        (click)="toggleMobileMenu()"
        type="button"
        aria-label="Toggle menu"
        class="md:hidden p-2 text-slate-300 hover:text-white rounded-lg hover:bg-slate-800/80 transition-colors"
      >
        @if (isMobileMenuOpen) {
          <lucide-icon [img]="XIcon" [size]="24"></lucide-icon>
        } @else {
          <lucide-icon [img]="MenuIcon" [size]="24"></lucide-icon>
        }
      </button>
    </div>

    <!-- Mobile Menu Drawer (Opaque background to prevent overlapping) -->
    @if (isMobileMenuOpen) {
      <div class="md:hidden pb-5 pt-2 border-t border-slate-800/80 bg-slate-900/98 backdrop-blur-xl px-2 shadow-2xl rounded-b-2xl">
        <div class="flex flex-col space-y-1.5 pt-1">
          @for (link of navLinks; track link.href) {
            <a
              (click)="scrollTo(link.href)"
              class="px-4 py-2.5 text-base font-medium text-slate-200 hover:text-cyan-400 hover:bg-slate-800/80 rounded-xl transition-colors cursor-pointer"
            >
              {{ link.label }}
            </a>
          }
          <div class="pt-2 px-2">
            <a
              href="assets/Arun_Angular_Profile.pdf"
              download
              (click)="closeMobileMenu()"
              class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-semibold text-slate-900 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-xl shadow-md hover:from-cyan-300 hover:to-blue-400 transition-all"
            >
              <lucide-icon [img]="DownloadIcon" [size]="16"></lucide-icon>
              Download Resume
            </a>
          </div>
        </div>
      </div>
    }
  </div>
</nav>
